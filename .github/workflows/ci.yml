name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --extra testing
      - run: uv run --locked --no-sync ruff check .
      - run: uv run --locked --no-sync ruff format --check .
      - run: uv run --locked --no-sync mypy src
      - run: uv run --locked --no-sync mkdocs build --strict

  test:
    # One Python for now (requires-python >=3.14); widen together with the package.
    # PostgreSQL tests start their own database through Docker; the RE Manager
    # tests need redis-server and fail without it here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Redis for the RE Manager tests
        run: sudo apt-get update -q && sudo apt-get install -y -q redis-server
      - run: uv sync --locked --group test --extra testing
      - run: uv run --locked --no-sync pytest
        env:
          ETT_REQUIRE_REDIS: "1"

  stack:
    # Builds the images, starts the multi-user demo stack with generated secrets
    # and runs the smoke test through the proxy, Grafana and the adapter.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Settings with generated secrets
        run: deploy/ci_settings.sh
      - name: Compose file
        run: docker compose -f deploy/compose.yaml --profile demo config -q
      - name: Build and start
        run: docker compose -f deploy/compose.yaml --profile demo up -d --build
      - name: Smoke test
        run: uv run --locked python deploy/smoke_test.py
      - name: MOUSE's Tiled 0.2.8 client against the stack's Tiled
        run: uv run --locked python deploy/old_client_check.py
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml --profile demo logs --tail 50
      - name: Clean up
        if: always()
        run: docker compose -f deploy/compose.yaml --profile demo down -v

  stack-podman:
    # The lab runs rootless Podman (docs/technical/questions-for-it.md): the same
    # stack and smoke test through Podman's Docker-compatible API, with Docker's
    # compose tool, as proposed for the lab (docs/technical/demo-stack.md#podman).
    runs-on: ubuntu-24.04
    env:
      DOCKER_BUILDKIT: "0"  # Podman's API serves the classic build endpoint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Settings with generated secrets
        run: deploy/ci_settings.sh
      - name: Rootless Podman's API socket
        run: |
          podman --version
          podman info --format 'rootless={{.Host.Security.Rootless}} network={{.Host.NetworkBackend}}'
          sock="$RUNNER_TEMP/podman.sock"
          podman system service --time=0 "unix://$sock" > "$RUNNER_TEMP/podman.log" 2>&1 &
          for _ in $(seq 30); do [ -S "$sock" ] && break; sleep 1; done
          echo "DOCKER_HOST=unix://$sock" >> "$GITHUB_ENV"
      - name: Compose talks to Podman, not to Docker
        run: docker version --format '{{range .Server.Components}}{{.Name}} {{end}}' | tee /dev/stderr | grep -qi podman
      - name: Build and start
        run: docker compose -f deploy/compose.yaml --profile demo up -d --build
      - name: Smoke test
        run: uv run --locked python deploy/smoke_test.py
      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f deploy/compose.yaml --profile demo ps -a
          docker compose -f deploy/compose.yaml --profile demo logs --tail 50
          tail -n 50 "$RUNNER_TEMP/podman.log"
      - name: Clean up
        if: always()
        run: docker compose -f deploy/compose.yaml --profile demo down -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: The wheel holds the package and nothing else
        run: |
          unzip -Z1 dist/*.whl > wheel.txt
          grep -qx 'event_timeline_tiled/py.typed' wheel.txt
          if grep -E '^(tests|docs|deploy|grafana)/' wheel.txt; then echo "wheel holds repo files"; exit 1; fi
      - name: The adapter imports from the installed wheel
        run: |
          uv venv "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel" dist/*.whl
          cd "$RUNNER_TEMP" && wheel/bin/python -c "import event_timeline_tiled.adapter"
