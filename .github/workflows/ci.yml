name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev --extra testing
      - run: uv run --locked --no-sync ruff check .
      - run: uv run --locked --no-sync ruff format --check .
      - run: uv run --locked --no-sync mypy src
      - run: uv run --locked --no-sync mkdocs build --strict

  test:
    # One Python for now (requires-python >=3.14); widen together with the package.
    # PostgreSQL contract tests join in step 3.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group test --extra testing
      - run: uv run --locked --no-sync pytest

  stack:
    # Builds the images, starts the multi-user demo stack with generated secrets
    # and runs the smoke test through the proxy, Grafana and the adapter.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Settings with generated secrets
        run: |
          umask 077
          secret() { python3 -c "import secrets; print(secrets.token_hex(32))"; }
          sed -e "s/^GF_ADMIN_PASSWORD=.*/GF_ADMIN_PASSWORD=$(secret)/" \
              -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(secret)/" \
              -e "s/^TILED_ADMIN_PASSWORD=.*/TILED_ADMIN_PASSWORD=$(secret)/" \
              -e "s/^TILED_SECRET_KEY=.*/TILED_SECRET_KEY=$(secret)/" \
              deploy/.env.example > deploy/.env
          if grep -q '=change-me$' deploy/.env; then echo "unreplaced change-me"; exit 1; fi
      - name: Compose file
        run: docker compose -f deploy/compose.yaml --profile demo config -q
      - name: Build and start
        run: docker compose -f deploy/compose.yaml --profile demo up -d --build
      - name: Smoke test
        run: uv run --locked python deploy/smoke_test.py
      - name: MOUSE's Tiled 0.2.8 client against the stack's Tiled
        run: uv run --locked python deploy/old_client_check.py
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml --profile demo logs --tail 50
      - name: Clean up
        if: always()
        run: docker compose -f deploy/compose.yaml --profile demo down -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: The wheel holds the package and nothing else
        run: |
          unzip -Z1 dist/*.whl > wheel.txt
          grep -qx 'event_timeline_tiled/py.typed' wheel.txt
          if grep -E '^(tests|docs|deploy|grafana)/' wheel.txt; then echo "wheel holds repo files"; exit 1; fi
      - name: The adapter imports from the installed wheel
        run: |
          uv venv "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel" dist/*.whl
          cd "$RUNNER_TEMP" && wheel/bin/python -c "import event_timeline_tiled.adapter"
