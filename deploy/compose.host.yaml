# Single host: the stack on the host's own network, everything on 127.0.0.1,
# for an instrument PC whose RE Manager or Bluesky HTTP Server listens on
# loopback only (docs/technical/single-host.md). Used on top of compose.yaml,
# without the demo profile:
#
#   docker-compose -f deploy/compose.yaml -f deploy/compose.host.yaml up --no-build --pull never
#
# Needs Compose 2.24.4 or later (!reset, !override). Written for rootless
# Podman, where ETT_ADAPTER_USER=0:0 is the host user who runs the stack;
# under Docker, give that user's $(id -u):$(id -g) instead (0:0 is root there).
#
# Settings (environment or deploy/.env), besides compose.yaml's:
#   ETT_ADAPTER_USER     required: the adapter's user (above), so it reads key
#                        files of mode 600 owned by the host user
#   ETT_TILED_KEY_FILE   required: host path of the Tiled API key file
#   ETT_QUEUE_KEY_FILE   host path of the Bluesky HTTP Server key file, used
#                        for every http queue in ETT_QUEUES (none: no key)
#   ETT_HTTP_PORT        the dashboards, http://127.0.0.1:<port>/ (8080)
#   ETT_GRAFANA_PORT     Grafana itself, behind the proxy (3000)
#   ETT_ADAPTER_PORT     the adapter (8000)

services:
  proxy:
    network_mode: host
    ports: !reset []
    environment:
      NGINX_LISTEN: 127.0.0.1:${ETT_HTTP_PORT:-8080}
      NGINX_GRAFANA: 127.0.0.1:${ETT_GRAFANA_PORT:-3000}
      NGINX_ADAPTER: 127.0.0.1:${ETT_ADAPTER_PORT:-8000}

  grafana:
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: ${ETT_GRAFANA_PORT:-3000}
      GF_SERVER_ROOT_URL: ${ETT_PUBLIC_URL:-http://127.0.0.1:${ETT_HTTP_PORT:-8080}/}
      ETT_ADAPTER_URL: http://127.0.0.1:${ETT_ADAPTER_PORT:-8000}

  adapter:
    network_mode: host
    user: ${ETT_ADAPTER_USER:?set ETT_ADAPTER_USER (0:0 under rootless Podman, docs/technical/single-host.md)}
    command: ["ett-adapter", "--host", "127.0.0.1", "--port", "${ETT_ADAPTER_PORT:-8000}"]
    environment:
      ETT_TILED_API_KEY_FILE: /run/ett/tiled.key
      ETT_QUEUE_API_KEY_FILE: /run/ett/queue.key
    volumes: !override
      - ${ETT_TILED_KEY_FILE:?set ETT_TILED_KEY_FILE to the Tiled key file}:/run/ett/tiled.key:ro
      - ${ETT_QUEUE_KEY_FILE:-/dev/null}:/run/ett/queue.key:ro
      - ${ETT_PRESETS:-./presets}:/presets:ro
