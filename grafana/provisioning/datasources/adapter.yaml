apiVersion: 1
datasources:
  # Panel queries are paths (/clips/frame?...); Infinity 4.1.6 puts this URL
  # in front of them (GetQueryURL in pkg/infinity/request.go). ETT_ADAPTER_URL
  # comes from deploy/compose.yaml: http://adapter:8000 on the stack's network,
  # http://127.0.0.1:<port> on a single host (docs/technical/single-host.md).
  - name: Timeline adapter
    uid: timeline-adapter
    type: yesoreyeram-infinity-datasource
    access: proxy
    editable: false
    url: ${ETT_ADAPTER_URL}
    jsonData:
      allowedHosts:
        - ${ETT_ADAPTER_URL}/
